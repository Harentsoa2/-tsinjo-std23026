spring.application.name=tsinjo
# ===============================================================
# ==         CONFIGURATION PRINCIPALE DE L'APPLICATION         ==
# ===============================================================

# --- CONFIGURATION DE LA BASE DE DONNÉES (DATASOURCE) ---
# C'est ici que vous définissez l'URL, l'utilisateur et le mot de passe de votre BDD Neon/PostgreSQL.
# Le paramètre ?sslmode=require est souvent nécessaire pour les BDD cloud comme Neon.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tsinjo}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:harentsoa}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- CONFIGURATION DE JPA / HIBERNATE ---
# On laisse Flyway s'occuper de la création/mise à jour des tables.
# Mettre 'none' est une pratique essentielle pour éviter les conflits avec Flyway.
spring.jpa.hibernate.ddl-auto=none

# Affiche les requêtes SQL générées par Hibernate dans la console (très utile pour le débogage).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# --- CONFIGURATION DE FLYWAY ---
# Active Flyway pour qu'il exécute les migrations au démarrage.
spring.flyway.enabled=true


# --- CONFIGURATION DU SERVEUR WEB ---
server.port=8080


# --- LOGGING ---
# Pour avoir des logs plus détaillés sur ce que fait Spring
logging.level.org.springframework=INFO
logging.level.com.tsinjo.emergencyfund=DEBUG